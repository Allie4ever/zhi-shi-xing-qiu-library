<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="私募研究尽调报告与路演材料静态资料库" />
    <title>知识星球材料库</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-mark">知</span>
        <span><strong>知识星球材料库</strong><small>PRIVATE FUND RESEARCH LIBRARY</small></span>
      </a>
      <span class="public-pill"><i></i> GitHub Pages 公开只读版</span>
    </header>

    <main class="workspace">
      <section class="hero">
        <div>
          <p class="kicker">RESEARCH ARCHIVE / 研究档案</p>
          <h1>把每一份材料，<em>变成可验证的判断。</em></h1>
          <p>静态展示已整理的尽调报告与路演材料。本公开版不包含付费原件、本地文件或凭据。</p>
        </div>
        <div class="stats">
          <div><strong id="material-count">0</strong><span>材料总数</span></div>
          <div><strong id="manager-count">0</strong><span>覆盖管理人</span></div>
        </div>
      </section>

      <nav class="tabs" aria-label="材料分类">
        <button class="active" data-route="due-diligence"><span>尽调报告</span><small>访谈、现场与完整尽调</small><b>0</b></button>
        <button data-route="manager-materials"><span>路演材料</span><small>管理人介绍、策略与产品材料</small><b>0</b></button>
      </nav>

      <section class="library">
        <div class="library-head">
          <div><p class="kicker">MATERIAL INDEX</p><h2 id="section-title">尽调报告</h2><p id="section-copy"></p></div>
          <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索管理人或策略" /></label>
        </div>
        <div class="status-filters" id="status-filters"></div>
        <div class="material-list" id="material-list"></div>
      </section>

      <footer><span id="reviewed-at"></span><span>公开只读版 · 本地原件未发布</span></footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
